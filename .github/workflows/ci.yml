name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

defaults:
  run:
    shell: bash

jobs:
  # ── Secrets leak detection ────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    name: Gitleaks Secrets Scan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Path change detection ──────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      discord: ${{ steps.filter.outputs.discord }}
      docs: ${{ steps.filter.outputs.docs }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      scripts: ${{ steps.filter.outputs.scripts }}
      services: ${{ steps.filter.outputs.services }}
      superapp: ${{ steps.filter.outputs.superapp }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            superapp:
              - 'app/**'
              - 'app-solid/**'
              - 'd5lang/**'
              - 'd5lang-port/**'
              - 'package.json'
            cli:
              - 'projects/github-repos-infra-pilot/cli/**'
              - 'projects/github-repos-infra-pilot/requirements.txt'
              - 'projects/github-repos-infra-pilot/pyproject.toml'
              - 'projects/github-repos-infra-pilot/Makefile'
              - 'projects/github-repos-infra-pilot/pytest.ini'
              - 'projects/github-repos-infra-pilot/bandit.yaml'
              - 'projects/github-repos-infra-pilot/.pre-commit-config.yaml'
              - 'projects/github-repos-infra-pilot/.isort.cfg'
              - 'projects/github-repos-infra-pilot/.editorconfig'
            dashboard:
              - 'projects/github-repos-infra-pilot/services/management-panel/**'
            discord:
              - 'projects/github-repos-infra-pilot/services/discord-service/**'
            docs:
              - 'docs/**'
              - 'projects/github-repos-infra-pilot/docs/**'
              - 'projects/github-repos-infra-pilot/wiki/**'
              - '*.md'
              - 'projects/github-repos-infra-pilot/*.md'
            infrastructure:
              - 'projects/github-repos-infra-pilot/infra/**'
            orchestrator:
              - 'projects/github-repos-infra-pilot/services/orchestrator-agent/**'
            scripts:
              - 'projects/github-repos-infra-pilot/scripts/**'
            services:
              - 'projects/github-repos-infra-pilot/services/**'

  # ── Super app (d5 root) ────────────────────────────────────────────
  check:
    needs: changes
    if: ${{ needs.changes.outputs.superapp == 'true' }}
    name: syntax check (app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
      - name: Syntax-check launcher scripts
        run: |
          node --check app/app.js
          node --check app/catalog.js
          node --check app/apps.js
          node --check app/tools.js
          node --check app/games.js
          node --check app/mc-games.js
          node --check app/mc-tools.js
          node --check app/mc-misc.js
          node --check app/apps2.js
          node -e "JSON.parse(require('fs').readFileSync('app/catalog.json','utf8')); console.log('catalog.json OK')"

  solid:
    needs: changes
    if: ${{ needs.changes.outputs.superapp == 'true' }}
    name: build (app-solid/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-solid/package-lock.json
      - name: Install and build
        working-directory: app-solid
        run: |
          npm ci
          npm run build

  d5lang:
    needs: changes
    if: ${{ needs.changes.outputs.superapp == 'true' }}
    name: build (d5lang/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke test
        working-directory: d5lang
        run: |
          make build
          make test

  verify:
    needs: changes
    if: ${{ needs.changes.outputs.superapp == 'true' }}
    name: verify port parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run verify_port.py
        run: python app-solid/verify_port.py

  # ── Full Codebase Test Sweep ─────────────────────────────────────
  all-tests:
    runs-on: ubuntu-latest
    name: Full Codebase Tests
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: projects/github-repos-infra-pilot/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/github-repos-infra-pilot/requirements.txt
          pip install ./projects/github-repos-infra-pilot/cli
      - name: Install Discord service dependencies
        working-directory: projects/github-repos-infra-pilot/services/discord-service
        run: npm install --legacy-peer-deps
      - name: Install management panel dependencies
        working-directory: projects/github-repos-infra-pilot/services/management-panel
        run: npm ci --legacy-peer-deps
      - name: Run every test suite with coverage
        run: bash projects/github-repos-infra-pilot/scripts/test.sh --coverage

  # ── CLI Service (Python) ───────────────────────────────────────────
  cli-lint:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    name: CLI Lint & Format
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            projects/github-repos-infra-pilot/requirements.txt
            projects/github-repos-infra-pilot/cli/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
      - name: Run flake8
        run: |
          flake8 projects/github-repos-infra-pilot/cli --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 projects/github-repos-infra-pilot/cli --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Check black formatting
        run: black --check projects/github-repos-infra-pilot/cli
      - name: Check import sorting
        run: isort --check-only projects/github-repos-infra-pilot/cli

  cli-test:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    name: CLI Unit Tests
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            projects/github-repos-infra-pilot/requirements.txt
            projects/github-repos-infra-pilot/cli/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/github-repos-infra-pilot/requirements.txt
          pip install pytest pytest-asyncio pytest-cov
          pip install ./projects/github-repos-infra-pilot/cli
      - name: Run pytest for CLI
        run: |
          pytest projects/github-repos-infra-pilot/tests/cli/ -q --cov=cli/ipilot --cov-report=xml --cov-report=term-missing --cov-fail-under=100
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: cli-service
          name: cli-service

  cli-security:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    name: CLI Security Checks
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security tools
        run: |
          pip install bandit pip-audit
      - name: Run Bandit security check
        run: bandit -c projects/github-repos-infra-pilot/bandit.yaml -r projects/github-repos-infra-pilot/cli -f json -o bandit-report.json
      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r projects/github-repos-infra-pilot/requirements.txt
          pip-audit -r projects/github-repos-infra-pilot/requirements.txt

  cli-build:
    needs: [changes, cli-lint, cli-test, cli-security]
    if: ${{ github.event_name == 'push' && (needs.changes.outputs.cli == 'true' || needs.changes.outputs.services == 'true') }}
    runs-on: ubuntu-latest
    name: CLI Build Image
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/cli-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: projects/github-repos-infra-pilot/cli
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/cli-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/cli-service:buildcache,mode=max

  # ── Management Panel (TypeScript, reusable) ────────────────────────
  dashboard:
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.services == 'true' }}
    name: Management Panel CI
    uses: ./.github/workflows/reusable-node-service.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      service-path: projects/github-repos-infra-pilot/services/management-panel
      image-name: ${{ github.repository }}/management-panel
      run-build: true
      type-check-command: npm run typecheck
      test-command: npm run test:coverage
      upload-coverage: true
      coverage-files: ./projects/github-repos-infra-pilot/services/management-panel/coverage/v8
      coverage-flag: dashboard
      coverage-name: dashboard-coverage

  # ── Management Panel Playwright ────────────────────────────────────
  dashboard-playwright:
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    name: Management Panel Playwright
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18'
          cache: 'npm'
          cache-dependency-path: projects/github-repos-infra-pilot/services/management-panel/package-lock.json
      - name: Install dependencies
        run: |
          cd projects/github-repos-infra-pilot/services/management-panel
          npm ci --legacy-peer-deps
      - name: Lint
        run: |
          cd projects/github-repos-infra-pilot/services/management-panel
          npm run lint
      - name: Build
        run: |
          cd projects/github-repos-infra-pilot/services/management-panel
          npm run build
      - name: Install Playwright browsers
        run: |
          cd projects/github-repos-infra-pilot/services/management-panel
          npm run playwright:install
      - name: Run Playwright tests (Demo gating enabled)
        run: |
          cd projects/github-repos-infra-pilot/services/management-panel
          VITE_DEMO_FEATURE_ENABLED=true npm run test:playwright
        env:
          VITE_DEMO_FEATURE_ENABLED: true
      - name: Run Playwright tests (Demo gating disabled)
        run: |
          cd projects/github-repos-infra-pilot/services/management-panel
          VITE_DEMO_FEATURE_ENABLED=false npm run test:playwright
        env:
          VITE_DEMO_FEATURE_ENABLED: false

  # ── Discord Service (Node.js, reusable) ────────────────────────────
  discord:
    needs: changes
    if: ${{ needs.changes.outputs.discord == 'true' || needs.changes.outputs.services == 'true' }}
    name: Discord Service CI
    uses: ./.github/workflows/reusable-node-service.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      service-path: projects/github-repos-infra-pilot/services/discord-service
      image-name: ${{ github.repository }}/discord-service
      run-tests: true
      test-command: npm run test:coverage
      upload-coverage: true
      coverage-files: ./projects/github-repos-infra-pilot/services/discord-service/coverage/v8
      coverage-flag: discord-service
      coverage-name: discord-service-coverage

  # ── Orchestrator Agent (Python) ────────────────────────────────────
  orchestrator-lint:
    needs: changes
    if: ${{ needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    name: Orchestrator Lint & Format
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: projects/github-repos-infra-pilot/services/orchestrator-agent/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
      - name: Run flake8
        run: |
          flake8 projects/github-repos-infra-pilot/services/orchestrator-agent --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 projects/github-repos-infra-pilot/services/orchestrator-agent --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Check black formatting
        run: black --check projects/github-repos-infra-pilot/services/orchestrator-agent
      - name: Check import sorting
        run: isort --check-only projects/github-repos-infra-pilot/services/orchestrator-agent

  orchestrator-test:
    needs: changes
    if: ${{ needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    name: Orchestrator Unit Tests
    strategy:
      fail-fast: false

    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gemini_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            projects/github-repos-infra-pilot/services/orchestrator-agent/requirements.txt
            projects/github-repos-infra-pilot/services/orchestrator-agent/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/github-repos-infra-pilot/services/orchestrator-agent/requirements.txt
          pip install -r projects/github-repos-infra-pilot/services/orchestrator-agent/requirements-dev.txt
      - name: Run pytest
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/infra_pilot_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd projects/github-repos-infra-pilot/services/orchestrator-agent
          pytest -q
      - name: Validate database migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/infra_pilot_test
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U test infra_pilot_test
          cd projects/github-repos-infra-pilot/services/orchestrator-agent
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./projects/github-repos-infra-pilot/services/orchestrator-agent/coverage.xml
          flags: orchestrator-agent
          name: orchestrator-agent

  orchestrator-security:
    needs: changes
    if: ${{ needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    name: Orchestrator Security Checks
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install security tools
        run: |
          pip install bandit pip-audit
      - name: Run Bandit security check
        run: bandit -c projects/github-repos-infra-pilot/bandit.yaml -r projects/github-repos-infra-pilot/services/orchestrator-agent/ -f json -o bandit-report.json
      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r projects/github-repos-infra-pilot/services/orchestrator-agent/requirements.txt
          pip-audit -r projects/github-repos-infra-pilot/services/orchestrator-agent/requirements.txt

  orchestrator-build:
    needs: [changes, orchestrator-lint, orchestrator-test, orchestrator-security]
    if: ${{ github.event_name == 'push' && (needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.services == 'true') }}
    runs-on: ubuntu-latest
    name: Orchestrator Build Image
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/orchestrator-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: projects/github-repos-infra-pilot/services/orchestrator-agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/orchestrator-agent:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/orchestrator-agent:buildcache,mode=max

  # ── Documentation ──────────────────────────────────────────────────
  docs-markdown-lint:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    name: Docs Markdown Lint
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint 'docs/**/*.md' 'projects/github-repos-infra-pilot/docs/**/*.md' 'projects/github-repos-infra-pilot/wiki/**/*.md' '*.md' --ignore node_modules --ignore .git --ignore '**/node_modules/**' --ignore '**/target/**'

  docs-check-links:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    name: Docs Check Links
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: 'docs/**/*.md projects/github-repos-infra-pilot/docs/**/*.md *.md --exclude "localhost" --exclude "127.0.0.1" --exclude "example.com" --exclude "your-domain.com" --exclude "github.com/your-org" --accept "200,429"'

  docs-spell-check:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    name: Docs Spell Check
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Install codespell
        run: pip install codespell
      - name: Run codespell
        run: codespell docs projects/github-repos-infra-pilot/docs --skip=".git,node_modules,target,package-lock.json,*.jar,*.png,*.svg" --ignore-words-list="infra,teh,ba,dae,hist,datas,re-use,alle,deine,oder,wege,sie,als,relevante,vor,erro,erros,ist,historial,bord,languagees,nome,manuell,offen"

  # ── Infrastructure ─────────────────────────────────────────────────
  infra-lint-python:
    needs: changes
    if: ${{ needs.changes.outputs.infrastructure == 'true' }}
    runs-on: ubuntu-latest
    name: Infra Lint Python
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install flake8 black isort
      - name: Lint infra
        run: |
          flake8 projects/github-repos-infra-pilot/infra/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 projects/github-repos-infra-pilot/infra/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          black --check projects/github-repos-infra-pilot/infra/

  infra-validate-terraform:
    needs: changes
    if: ${{ needs.changes.outputs.infrastructure == 'true' }}
    runs-on: ubuntu-latest
    name: Infra Validate Terraform
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5
      - name: Terraform validate
        working-directory: projects/github-repos-infra-pilot/infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
          terraform fmt -check -diff

  infra-validate-prometheus:
    needs: changes
    if: ${{ needs.changes.outputs.infrastructure == 'true' }}
    runs-on: ubuntu-latest
    name: Infra Validate Prometheus
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Install promtool
        run: |
          PROM_VERSION=2.53.0
          PROM_SHA256=d9900a11e3c89261e6416e3c9989858bad7b206af8b6838dfe9a5392d8ddc60d
          curl -fsSL -o /tmp/prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz
          echo "${PROM_SHA256}  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo mv /tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool /usr/local/bin/
          promtool --version
      - name: Check Prometheus config
        run: |
          if [ -f projects/github-repos-infra-pilot/infra/monitoring/prometheus/prometheus.yml ]; then
            promtool check config projects/github-repos-infra-pilot/infra/monitoring/prometheus/prometheus.yml
            if [ -f projects/github-repos-infra-pilot/infra/monitoring/prometheus/alerts.yml ]; then
              promtool check rules projects/github-repos-infra-pilot/infra/monitoring/prometheus/alerts.yml
            fi
          fi
      - name: Check alert rules syntax
        run: |
          if [ -f projects/github-repos-infra-pilot/infra/monitoring/prometheus/alerts.yml ]; then
            promtool check rules projects/github-repos-infra-pilot/infra/monitoring/prometheus/alerts.yml
          else
            echo "No alerts.yml found, skipping"
          fi

  # ── Scripts ────────────────────────────────────────────────────────
  scripts-shellcheck:
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    name: Scripts ShellCheck
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./projects/github-repos-infra-pilot/scripts
          severity: warning

  scripts-verify:
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    name: Scripts Verify Syntax
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Check bash syntax
        run: |
          for script in projects/github-repos-infra-pilot/scripts/*.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done
      - name: Run health check test
        run: |
          chmod +x projects/github-repos-infra-pilot/scripts/healthcheck.sh
          bash projects/github-repos-infra-pilot/scripts/healthcheck.sh --dry-run
      - name: Run verify script
        run: |
          chmod +x projects/github-repos-infra-pilot/scripts/verify.sh
          bash projects/github-repos-infra-pilot/scripts/verify.sh --offline
