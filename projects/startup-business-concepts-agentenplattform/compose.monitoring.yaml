# Optionales Monitoring-Profil: Prometheus + Grafana (separat aktivierbar).
# Start: docker compose -f compose.yaml -f compose.monitoring.yaml --profile monitoring up -d
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: [./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    networks: [intern]
    profiles: [monitoring]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.1.0
    volumes: [grafana-data:/var/lib/grafana]
    networks: [intern]
    profiles: [monitoring]
    restart: unless-stopped
volumes: {grafana-data: {}}
