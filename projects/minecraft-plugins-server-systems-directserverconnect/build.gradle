plugins {
    id 'java'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://repo.spigotmc.org/content/repositories/spigot-repo/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.0-R0.1-SNAPSHOT' // Passen Sie die Version nach Bedarf an
}

jar {
    archiveBaseName.set('DirectServerConnect')
    archiveVersion.set(version)
    archiveClassifier.set('')
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
