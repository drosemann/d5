<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="guestbook">
        <h1>Guestbook</h1>
        
        <div class="entry-form">
            <h2>Leave a Message</h2>
            <form id="guestbookForm">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <textarea id="message" placeholder="Your Message" required></textarea>
                <div class="formatting-toolbar">
                    <button type="button" class="format-btn">😊 Emoji</button>
                    <button type="button" class="format-btn">B</button>
                    <button type="button" class="format-btn">I</button>
                </div>
                <button type="submit">Submit</button>
                <noscript>
                    <p class="error">Please enable JavaScript to use this guestbook.</p>
                </noscript>
            </form>
        </div>
        
        <div class="entries" id="entriesContainer">
            <!-- Entries will be added here dynamically -->
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
