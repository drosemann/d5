plugins {
    id 'java'
}

group 'org.example'
version '1.0.0'

sourceCompatibility = '1.8' // or your desired Java version

repositories {
    mavenCentral()
    maven { url 'https://repo.extendedclip.com/content/repositories/gradle-plugin-releases/' }
}

dependencies {
    // Spigot API dependency
    compileOnly 'org.spigotmc:spigot-api:1.19.3-R0.1-SNAPSHOT' // Change to your server version

    // Optional: Vault API for economy integration
    compileOnly 'net.milkbowl.vault:VaultAPI:1.7' // Change to the latest version if needed
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    // Specify the main class for your plugin
    manifest {
        attributes(
            'Main-Class': 'org.example.sessionlock.sessionlock.SessionLockPlugin',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}
